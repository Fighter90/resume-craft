name: "🐛 Баг-репорт"
description: "Сообщить об ошибке в ResumeCraft"
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - sergejemelanov
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение об ошибке! Пожалуйста, заполните форму ниже.
        **⚠️ Если это уязвимость безопасности — НЕ создавайте Issue, используйте [Security Advisories](../../security/advisories/new).**

  - type: textarea
    id: description
    attributes:
      label: "Описание бага"
      description: "Чёткое описание проблемы"
      placeholder: "При загрузке PDF-резюме возникает ошибка 500..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Шаги воспроизведения"
      description: "Пошаговая инструкция для воспроизведения"
      placeholder: |
        1. Перейти на страницу загрузки
        2. Загрузить PDF-файл размером > 5MB
        3. Нажать «Отправить»
        4. Увидеть ошибку
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Ожидаемое поведение"
      description: "Что должно было произойти?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Фактическое поведение"
      description: "Что произошло на самом деле?"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Критичность"
      options:
        - "🔴 Критичная (сервис недоступен)"
        - "🟠 Высокая (ключевая функция сломана)"
        - "🟡 Средняя (обходной путь существует)"
        - "🟢 Низкая (косметическая проблема)"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Версия"
      description: "Версия приложения или коммит"
      placeholder: "0.1.0-alpha"

  - type: textarea
    id: environment
    attributes:
      label: "Окружение"
      description: "ОС, браузер, Python-версия и т.д."
      placeholder: |
        - OS: macOS 15.3
        - Browser: Chrome 131
        - Python: 3.11.8

  - type: textarea
    id: logs
    attributes:
      label: "Логи / Трейсбэк"
      description: "Вставьте релевантные логи (БЕЗ секретов/токенов!)"
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: "Подтверждение"
      options:
        - label: "Я проверил(а), что аналогичный Issue не существует"
          required: true
        - label: "Я убедился(ась), что логи не содержат секретов или персональных данных"
          required: true
