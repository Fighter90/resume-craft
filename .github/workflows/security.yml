# =============================================================================
# Security Pipeline — SAST, Dependency Audit, Secret Scanning
# =============================================================================
# Note: CodeQL and SARIF upload require GitHub Advanced Security (GHAS),
# which is not available for private repos on the free plan.
# These features are removed to avoid "No jobs were run" errors.

name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
  schedule:
    # Еженедельное сканирование по понедельникам в 08:00 MSK
    - cron: "0 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Bandit — SAST для Python
  # ---------------------------------------------------------------------------
  bandit:
    name: "🔒 Bandit SAST"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r . \
            -x ./.venv,./.git,./tests,./Prototype \
            -f json \
            -o bandit-report.json \
            --severity-level medium \
            || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

      - name: Bandit (console output)
        run: |
          bandit -r . \
            -x ./.venv,./.git,./tests,./Prototype \
            --severity-level medium \
            || true

  # ---------------------------------------------------------------------------
  # pip-audit — аудит зависимостей на известные CVE
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: "📦 Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies & pip-audit
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --strict --desc || true

  # ---------------------------------------------------------------------------
  # Gitleaks — поиск утечек секретов в коде и истории
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: "🔑 Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact

  # ---------------------------------------------------------------------------
  # Trivy — сканирование Docker-образа (если есть Dockerfile)
  # ---------------------------------------------------------------------------
  trivy:
    name: "🐳 Trivy Container Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t resumecraft:scan .

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scanner
        run: trivy image --severity CRITICAL,HIGH --format table resumecraft:scan

      - name: Trivy JSON report
        if: always()
        run: trivy image --severity CRITICAL,HIGH --format json -o trivy-results.json resumecraft:scan || true

      - name: Upload Trivy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.json
          retention-days: 30
