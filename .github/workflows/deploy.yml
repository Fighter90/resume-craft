# =============================================================================
# Deploy Pipeline — Auto deploy to production on push to master
# =============================================================================

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          timeout: 900s
          script: |
            set -euo pipefail
            cd /opt/resumecraft

            echo "=== Pulling latest code ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== Cleaning disk before build ==="
            docker builder prune -af 2>/dev/null || true
            docker image prune -f 2>/dev/null || true

            echo "=== Building Docker images (sequential to save disk) ==="
            docker compose build app 2>&1 | tail -10
            docker compose build celery-worker 2>&1 | tail -10
            docker compose build flower 2>&1 | tail -10
            docker compose build frontend 2>&1 | tail -10

            echo "=== Restarting services ==="
            docker compose up -d --remove-orphans

            echo "=== Running database migrations ==="
            docker compose exec -T app alembic upgrade head 2>&1 || {
              echo "⚠️ Migration failed, checking if DB is ready..."
              sleep 5
              docker compose exec -T app alembic upgrade head 2>&1
            }

            echo "=== Waiting for health check ==="
            sleep 10
            for i in $(seq 1 30); do
              STATUS=$(curl -sf http://localhost:8000/health 2>/dev/null | grep -o '"healthy"' || true)
              if [ "$STATUS" = '"healthy"' ]; then
                echo "✅ Health check passed!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 5
            done

            if [ "$STATUS" != '"healthy"' ]; then
              echo "❌ Health check failed!"
              docker compose logs --tail=50 app
              exit 1
            fi

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Running acceptance tests ==="
            # pytest не входит в production-образ — ставим временно
            docker compose exec -T --user root app pip install pytest --quiet 2>&1
            # Копируем тест-файл в контейнер (tests/ нет в образе)
            docker cp tests/test_acceptance.py resumecraft-app:/app/test_acceptance.py
            docker compose exec -T \
              -e BASE_URL=http://localhost:8000 \
              -e PYTHONPATH=src \
              app python -m pytest /app/test_acceptance.py \
              -v --tb=short --no-header \
              -x \
              2>&1 || {
              echo "❌ Acceptance tests failed!"
              docker compose logs --tail=30 app
              exit 1
            }
            # Убираем тест-файл из контейнера
            docker compose exec -T --user root app rm -f /app/test_acceptance.py
            echo "✅ Acceptance tests passed!"

            echo "=== Deploy complete ==="
            docker compose ps
