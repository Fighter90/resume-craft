<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeCraft — Восстановление пароля</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared-styles.css">
    <script src="shared-nav.js"></script>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-body);">
<div style="width:100%;max-width:420px;padding:1rem;">
    <div class="card" style="padding:2.5rem;text-align:center;">
        <div style="width:56px;height:56px;background:var(--primary-light);border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--primary);margin:0 auto 1.5rem;">
            <svg class="icon-lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;">Восстановление пароля</h2>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:2rem;line-height:1.5;">Введите email вашего аккаунта. Мы отправим ссылку для сброса пароля.</p>
        <div class="input-group" style="text-align:left;margin-bottom:1rem;">
            <label class="input-label">Email</label>
            <input type="email" class="input-field" placeholder="alex@example.com">
        </div>
        <a href="04-email-verify.html" class="btn btn-primary btn-block" style="margin-bottom:1.5rem;">Отправить ссылку</a>
        <a href="02-auth.html" style="font-size:0.9rem;color:var(--text-secondary);">
            <svg class="icon-sm" style="vertical-align:middle;margin-right:0.25rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Вернуться к входу
        </a>
    </div>
</div>
</body>
</html>
