<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeCraft — Безопасность</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared-styles.css">
    <script src="shared-nav.js"></script>
</head>
<body>
<div class="app-shell">
    <script>document.write(buildSidebar('settings'));</script>
    <div class="main-content">
        <script>document.write(buildMobileHeader('Настройки'));</script>
        <div class="view" style="animation:fadeIn .3s ease;">
            <div class="page-header">
                <div>
                    <h1>Настройки</h1>
                </div>
            </div>

            <div class="tab-bar" style="margin-bottom:2rem;">
                <a href="16-settings-profile.html" class="tab-bar-item">Профиль</a>
                <a href="17-settings-ai.html" class="tab-bar-item">AI-модели</a>
                <a href="18-settings-subscription.html" class="tab-bar-item">Подписка</a>
                <a href="19-settings-security.html" class="tab-bar-item active">Безопасность</a>
            </div>

            <div style="max-width:720px;">
                <!-- Change password -->
                <div class="card" style="margin-bottom:1.5rem;">
                    <h3 style="font-size:1.1rem;font-weight:700;margin-bottom:1.5rem;">Сменить пароль</h3>
                    <div style="display:flex;flex-direction:column;gap:1rem;">
                        <div class="input-group">
                            <label class="input-label">Текущий пароль</label>
                            <input type="password" class="input-field" value="••••••••">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Новый пароль</label>
                            <input type="password" class="input-field" placeholder="Мин. 8 символов, цифра + буква">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Подтвердите пароль</label>
                            <input type="password" class="input-field" value="••••••••">
                        </div>
                    </div>
                    <div style="margin-top:1.5rem;">
                        <button class="btn btn-primary">
                            <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                            Обновить пароль
                        </button>
                    </div>
                </div>

                <!-- Danger zone -->
                <div class="card" style="border:2px solid var(--danger);border-radius:var(--radius-md);">
                    <h3 style="font-size:1.1rem;font-weight:700;color:var(--danger);margin-bottom:0.5rem;">
                        <svg class="icon-sm" style="vertical-align:middle;margin-right:0.25rem;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                        Опасная зона
                    </h3>
                    <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:1.5rem;line-height:1.5;">
                        Аккаунт будет помечен для удаления. Через 30 дней все данные будут безвозвратно утрачены. Вы можете отменить удаление в любой момент, просто войдя в аккаунт.
                    </p>
                    <button class="btn btn-danger btn-sm">Удалить аккаунт</button>
                </div>
            </div>
        </div>
        <script>document.write(buildBottomNav('settings'));</script>
    </div>
</div>
<style>
@media(max-width:768px) {
    .tab-bar { overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
}
</style>
</body>
</html>
