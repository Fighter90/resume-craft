<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeCraft — Проверьте почту</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared-styles.css">
    <script src="shared-nav.js"></script>
    <style>
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .envelope { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-body);">
<div style="width:100%;max-width:420px;padding:1rem;">
    <div class="card" style="padding:2.5rem;text-align:center;">
        <div class="envelope" style="width:72px;height:72px;background:var(--success-light);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--success);margin:0 auto 1.5rem;">
            <svg style="width:36px;height:36px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <h2 style="font-size:1.5rem;font-weight:700;margin-bottom:0.5rem;">Проверьте почту</h2>
        <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:0.5rem;line-height:1.5;">Мы отправили письмо на</p>
        <p style="font-weight:600;margin-bottom:1.5rem;">alex@example.com</p>
        <p style="color:var(--text-tertiary);font-size:0.85rem;line-height:1.5;margin-bottom:2rem;">Нажмите на ссылку в письме для подтверждения аккаунта. Письмо придёт в течение 1–2 минут.</p>
        <a href="06-dashboard.html" class="btn btn-primary btn-block" style="margin-bottom:1rem;">Я подтвердил email</a>
        <div style="display:flex;gap:1rem;justify-content:center;">
            <button class="btn btn-ghost btn-sm" style="color:var(--primary);">Отправить повторно</button>
            <a href="02-auth.html" class="btn btn-ghost btn-sm">Изменить email</a>
        </div>
    </div>
</div>
</body>
</html>
